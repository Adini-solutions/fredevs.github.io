<!DOCTYPE html>
<html lang="es-AR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- El .ico queda de respaldo para los navegadores que no aceptan favicon en SVG. -->
  <link rel="icon" href="%PUBLIC_URL%/assets/icons/adini.ico" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/assets/brand/adini-isotipo-purple.svg" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/brand/adini-isotipo-512.png" />
  <meta name="theme-color" content="#091c30" />

  <!--
    Valores por defecto (los del home). Cada página los reemplaza con los suyos
    desde src/seo/pages.js: data-rh="true" hace que react-helmet-async los
    sustituya en vez de duplicarlos, y el prerender (scripts/prerender.js) los
    deja escritos en el HTML de cada ruta.
  -->
  <title>ADINI | Agentes de IA y software a medida</title>
  <meta data-rh="true" name="description" content="ADINI diseña, integra y opera agentes de IA, software a medida e infraestructura para empresas e instituciones. Partner oficial de la UTN FRBA." />
  <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large" />
  <link data-rh="true" rel="canonical" href="https://adini.com.ar/" />

  <meta data-rh="true" property="og:type" content="website" />
  <meta data-rh="true" property="og:site_name" content="ADINI" />
  <meta data-rh="true" property="og:locale" content="es_AR" />
  <meta data-rh="true" property="og:title" content="ADINI | Agentes de IA y software a medida" />
  <meta data-rh="true" property="og:description" content="ADINI diseña, integra y opera agentes de IA, software a medida e infraestructura para empresas e instituciones. Partner oficial de la UTN FRBA." />
  <meta data-rh="true" property="og:url" content="https://adini.com.ar/" />
  <!-- Imagen al compartir (WhatsApp, LinkedIn, etc.): el logotipo sobre el azul de la marca. -->
  <meta data-rh="true" property="og:image" content="https://adini.com.ar/assets/brand/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ADINI" />

  <meta data-rh="true" name="twitter:card" content="summary_large_image" />
  <meta data-rh="true" name="twitter:title" content="ADINI | Agentes de IA y software a medida" />
  <meta data-rh="true" name="twitter:description" content="ADINI diseña, integra y opera agentes de IA, software a medida e infraestructura para empresas e instituciones. Partner oficial de la UTN FRBA." />
  <meta data-rh="true" name="twitter:image" content="https://adini.com.ar/assets/brand/og-image.jpg" />

  <meta name="geo.region" content="AR-C" />
  <meta name="geo.placename" content="Ciudad Autónoma de Buenos Aires" />

  <!-- Resumen para modelos de lenguaje (https://llmstxt.org) -->
  <link rel="alternate" type="text/markdown" href="/llms.txt" title="ADINI para LLMs" />

  <!--
    JSON-LD global: la organización y el sitio. Cada página suma el suyo
    (WebPage, servicio, preguntas frecuentes) desde src/seo/schema.js y los
    referencia por @id.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://adini.com.ar/#organization",
          "name": "ADINI",
          "url": "https://adini.com.ar/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://adini.com.ar/assets/brand/adini-isotipo-512.png",
            "width": 512,
            "height": 512
          },
          "image": "https://adini.com.ar/assets/brand/og-image.jpg",
          "description": "Empresa argentina que diseña, integra y opera agentes de IA, software a medida e infraestructura para empresas e instituciones, con modelos en servidores propios o en la nube. Partner oficial de la UTN Facultad Regional Buenos Aires, donde dicta el curso de IA híbrida, privada y local.",
          "slogan": "Agentes de IA y software para automatizar tu operación",
          "foundingDate": "2024",
          "email": "contacto@adini.com.ar",
          "telephone": "+54 9 11 4412-3760",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Ciudad Autónoma de Buenos Aires",
            "addressRegion": "CABA",
            "addressCountry": "AR"
          },
          "areaServed": { "@type": "Country", "name": "Argentina" },
          "knowsAbout": [
            "Agentes de IA",
            "IA privada",
            "Modelos de lenguaje en servidores propios",
            "Automatización de procesos",
            "Desarrollo de software a medida",
            "Infraestructura y cloud"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "contacto@adini.com.ar",
            "telephone": "+54 9 11 4412-3760",
            "areaServed": "AR",
            "availableLanguage": ["es", "en"]
          },
          "sameAs": [
            "https://www.linkedin.com/company/adiniar",
            "https://www.instagram.com/adini.solutions/",
            "https://www.facebook.com/profile.php?id=61581291992126",
            "https://stories.adini.com.ar"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://adini.com.ar/#website",
          "url": "https://adini.com.ar/",
          "name": "ADINI",
          "inLanguage": "es-AR",
          "publisher": { "@id": "https://adini.com.ar/#organization" }
        }
      ]
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&family=Poppins:wght@100..900&display=swap"
    rel="stylesheet" />
</head>

<body style="font-family: 'Noto Sans', sans-serif">
  <div id="root"></div>
</body>

</html>
