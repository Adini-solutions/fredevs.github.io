<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Adini</title>
    <!-- /dev, /infra y las demás rutas llegan acá en GitHub Pages; WhatsApp y
         las redes no ejecutan el script de abajo, así que leen estas tags. -->
    <meta property="og:title" content="ADINI | Agencia de Desarrollo de Software" />
    <meta property="og:description" content="Agencia de desarrollo de software y soluciones digitales." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://adini.com.ar/assets/brand/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://adini.com.ar/assets/brand/og-image.jpg" />
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')
      );
    </script>
  </head>
  <body></body>
</html>
