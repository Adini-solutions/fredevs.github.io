name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombre de la imagen
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/adini-landing:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El Dockerfile hace build + prerender (Playwright) + nginx. En PRs sólo
      # se construye, para que un build o prerender roto no llegue a main.
      - name: Build (y push fuera de PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    env:
      # ssh.adini.com.ar está detrás de Cloudflare Access (SSH sobre Zero
      # Trust) — sin esto, cloudflared pide login interactivo por browser.
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      SSH_HOST: golivieri@ssh.adini.com.ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar gettext-base (envsubst) si falta
        run: command -v envsubst >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y --no-install-recommends gettext-base)

      - name: Instalar cloudflared
        # Pineado a 2026.5.1: desde 2026.6.0 "access ssh" ignora el service
        # token y cae a login interactivo (cloudflare/cloudflared#1673).
        run: |
          sudo curl -sSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configurar acceso vía Cloudflare Access
        # "cloudflared access ssh" no toma CF_ACCESS_CLIENT_ID/SECRET solo: hay
        # que pasarlos con --service-token-id/--service-token-secret.
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host ssh.adini.com.ar
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy a vm-3
        # cloudflared access ssh falla de forma intermitente contra el edge de
        # Cloudflare Access; reintentamos porque es transitorio.
        run: |
          max_attempts=3
          attempt=1
          until ./deploy/deploy-vm.sh "$SSH_HOST" "${{ needs.docker-image.outputs.image }}"; do
            exit_code=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Deploy falló tras $attempt intentos (exit $exit_code)."
              exit $exit_code
            fi
            echo "Intento $attempt falló (exit $exit_code). Reintentando en 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Smoke test
        run: ./deploy/smoke-test-vm.sh "$SSH_HOST"
