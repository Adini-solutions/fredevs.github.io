server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # www -> raíz. Va acá y no en el ingress: Cloudflare termina el TLS y el ingress armaría http://...:80.
  if ($host = www.adini.com.ar) {
    return 301 https://adini.com.ar$request_uri;
  }

  # index.html nunca se cachea, para que cada deploy se vea al instante.
  add_header Cache-Control "no-cache";

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Assets con hash en el nombre: cache largo.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rutas de la SPA: responden 200 con index.html (antes GitHub Pages devolvía 404 + redirect).
  location ~ ^/(dev|infra|ia)/?$ {
    try_files /index.html =404;
  }

  # Archivos reales (assets, CNAME, verificación de Visma). Lo demás: 404 real con la página NotFound.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /index.html;
}
